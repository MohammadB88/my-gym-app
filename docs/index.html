<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Tracker — Training Plan</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #22262f;
    --text: #e6e8ec;
    --muted: #9aa0ac;
    --accent: #4ade80;
    --accent-dim: #2a3b30;
    --line: #2c313b;
    --mm-base: #333945;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 0 auto;
    /* Respect the notch / rounded corners on modern phones */
    padding: 12px max(14px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  header { margin-bottom: 8px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }

  /* Day selector tabs */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0 2px; }
  .tab {
    min-height: 44px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card2); color: var(--muted);
    font-size: 0.8rem; font-weight: 600; touch-action: manipulation; padding: 0 4px;
  }
  .tab.on { background: var(--accent); color: #0b1f14; border-color: var(--accent); }
  .tab:active { transform: scale(0.98); }

  .progress-wrap {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 12px 0 10px;
    /* Cover the gap that appears when the card scrolls under the sticky bar */
    box-shadow: 0 8px 8px -4px var(--bg);
  }
  .bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .progress-label { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }

  .exercise {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 10px;
    margin-bottom: 12px;
    overflow-wrap: break-word;
  }
  .exercise.done { border-color: var(--accent-dim); }

  /* Anatomical muscle map — replaces the old machine photo. A front/back body
     figure with the trained muscles highlighted, plus a named legend. */
  .ex-img {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    background: var(--card2);
    padding: 10px 10px 8px;
  }
  .ex-img-ph {
    display: flex; align-items: center; justify-content: center;
    min-height: 120px; color: var(--muted); font-size: 0.8rem; letter-spacing: .02em;
  }
  /* Muscle-map figures: one (front or back) or two, centered side by side. */
  .mm { display: flex; justify-content: center; gap: 12px; }
  .mm-fig { margin: 0; text-align: center; }
  .mm-fig svg { height: 210px; width: auto; display: block; }
  .mm-fig figcaption {
    margin-top: 2px; color: var(--muted); font-size: 0.68rem;
    letter-spacing: .04em; text-transform: uppercase;
  }
  /* Anatomical region fills. --mm-base (in :root) is the dim resting fill that
     forms the whole body; lit primaries use the accent, lit2 secondaries a muted
     mid-green. Drawn from the path data in body-paths.js. */
  .mm-base-fill { fill: var(--mm-base); }
  .mm-lit  { fill: var(--accent); }
  .mm-lit2 { fill: #2f7a4e; }
  /* Named legend under the figure(s): primary chips bold-accent, secondary muted. */
  .mm-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 8px; }
  .mm-chip {
    font-size: 0.68rem; padding: 2px 8px; border-radius: 99px;
    border: 1px solid var(--line); line-height: 1.4;
  }
  .mm-chip.p { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); font-weight: 600; }
  .mm-chip.s { color: var(--muted); }
  .ex-head { display: flex; align-items: baseline; gap: 8px; }
  .ex-num {
    font-size: 0.75rem; font-weight: 700; color: var(--accent);
    background: var(--accent-dim); padding: 2px 7px; border-radius: 6px; flex: none;
  }
  .ex-name { font-weight: 600; font-size: 1rem; line-height: 1.25; }
  .ex-meta { color: var(--muted); font-size: 0.8rem; margin: 6px 0 2px; }
  .cue { color: var(--muted); font-size: 0.78rem; line-height: 1.4; margin: 8px 0 10px; }
  /* Reference links (machine page + how-to). Stack on their own rows so both
     stay tappable on narrow screens. */
  .ref-links { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
  .tg-link {
    display: inline-block; align-self: flex-start;
    color: var(--accent); font-size: 0.78rem; text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .tg-link:hover { border-bottom-color: var(--accent); }

  /* Prominent "watch the movement" button under the muscle map. We can't embed
     real exercise animations (licensing/offline — see CLAUDE.md), so this is the
     one-tap path to an actual demo video. Styled as a primary action: accent
     outline, full-width, 48px tap target. */
  .demo-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; min-height: 48px; margin: 0 0 12px; padding: 0 14px;
    border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent-dim); color: var(--accent);
    font-size: 0.9rem; font-weight: 600; text-decoration: none;
    touch-action: manipulation; transition: background .12s ease;
  }
  .demo-btn:hover, .demo-btn:active { background: var(--accent); color: #0b1f14; }
  .demo-btn:active { transform: scale(0.99); }
  .demo-play { font-size: 0.8rem; flex: none; }
  .demo-ext { margin-left: auto; opacity: 0.7; flex: none; }

  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .set-btn {
    min-width: 120px; height: 46px; padding: 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card2);
    color: var(--muted); font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all .12s ease; touch-action: manipulation;
  }
  .set-btn.on {
    background: var(--accent); color: #0b1f14; border-color: var(--accent);
  }

  .log { display: flex; gap: 8px; }
  .log input {
    flex: 1; min-width: 0;
    background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 12px;
    /* 16px prevents iOS Safari from auto-zooming when the field is focused */
    font-size: 16px;
  }
  .log input::placeholder { color: #6b717d; }
  .log input:focus { outline: none; border-color: var(--accent); }

  /* "Last time you did this" hint, read from workout history */
  .last-hint { color: var(--muted); font-size: 0.78rem; margin: 8px 0 0; min-height: 1em; }
  .last-hint b { color: var(--text); font-weight: 600; }

  /* Per-exercise progression chart toggle + panel */
  .prog-toggle {
    display: inline-block; margin: 8px 0 0; padding: 0;
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.78rem; font-weight: 600;
    touch-action: manipulation;
  }
  .prog-panel { margin-top: 10px; }
  .prog-panel svg { width: 100%; height: auto; display: block; }
  .prog-empty { color: var(--muted); font-size: 0.78rem; margin: 8px 0 0; }
  /* Chart marks: recessive grid/axis, thin accent line, visible dots */
  .prog-grid { stroke: var(--line); stroke-width: 1; }
  .prog-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .prog-dot  { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .prog-axis { fill: var(--muted); font-size: 10px; }

  /* Finish and Reset each get their own full-width row. Grid keeps this stable
     at every phone width — no overflow, no clipping. */
  .footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px; margin: 8px 0 24px;
  }
  .footer button {
    min-height: 48px; padding: 12px 8px; border-radius: 12px;
    border: 1px solid var(--line); font-size: 0.9rem; cursor: pointer;
    touch-action: manipulation; white-space: nowrap;
  }
  button.act { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  button.act:active { background: #33513e; }
  button.reset { background: var(--card); color: var(--muted); grid-column: 1 / -1; }
  button.reset:active { background: var(--card2); }
  .done-badge { color: var(--accent); font-size: 0.8rem; margin-left: auto; align-self: center; }

  /* Auth gate */
  #authScreen {
    min-height: 80vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 16px;
  }
  #authScreen h1 { font-size: 1.3rem; margin: 0; }
  #authScreen p { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 320px; }
  .gh-login-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 48px; padding: 0 20px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card2); color: var(--text);
    font-size: 0.95rem; font-weight: 600; cursor: pointer; touch-action: manipulation;
  }
  .gh-login-btn:active { background: var(--card); }
  #authError { color: #f87171; font-size: 0.8rem; max-width: 320px; }
  #userBar {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; margin: -4px 0 8px; color: var(--muted); font-size: 0.78rem;
  }
  #userBar button {
    background: none; border: none; color: var(--muted); font-size: 0.78rem;
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="authScreen" hidden>
  <h1>Gym Tracker</h1>
  <p>Sign in with GitHub to sync your training data.</p>
  <button class="gh-login-btn" id="loginBtn">Log in with GitHub</button>
  <p id="authError" hidden></p>
</div>

<div id="app" hidden>
<div id="userBar">
  <span id="userEmail"></span>
  <button id="logoutBtn">Log out</button>
</div>
<header>
  <h1 id="dayTitle">Day 1 — Full-Body</h1>
  <p class="sub" id="daySub">Machine-focused · 2–3 reps in reserve · knee-conscious</p>
  <div class="tabs" id="tabs">
    <button class="tab" data-day="1">Day 1</button>
    <button class="tab" data-day="2">Day 2</button>
    <button class="tab" data-day="3">Day 3</button>

  </div>
</header>

<div class="progress-wrap">
  <div class="bar"><span id="barFill"></span></div>
  <p class="progress-label" id="progressLabel">&nbsp;</p>
</div>

<div id="list"></div>

<div class="footer">
  <button class="act" id="finishBtn" style="grid-column: 1 / -1; background: var(--accent); color: #0b1f14; border-color: var(--accent);">✓ Finish workout &amp; save to history</button>
  <button class="reset" id="resetBtn">Reset</button>
</div>
</div>

<script src="exercises.js"></script>
<script src="body-paths.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nvqiqjuygrwzqwghdmdl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_W3ofKozTUHcegg1Z_0HuMg_z3xcH40C";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const authScreen = document.getElementById("authScreen");
const appRoot = document.getElementById("app");
const authError = document.getElementById("authError");

document.getElementById("loginBtn").addEventListener("click", async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "github",
    options: { redirectTo: window.location.href },
  });
  if (error) {
    authError.textContent = error.message;
    authError.hidden = false;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.reload();
});

window.__supabase = supabase;

function showAuthed(session) {
  authScreen.hidden = true;
  appRoot.hidden = false;
  window.__gymUserId = session.user.id;
  document.getElementById("userEmail").textContent =
    session.user.user_metadata?.user_name || session.user.email || session.user.id;
  window.__gymAppInit?.();
}

function showLoggedOut() {
  appRoot.hidden = true;
  authScreen.hidden = false;
}

const { data: { session } } = await supabase.auth.getSession();
if (session) showAuthed(session);
else showLoggedOut();

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) showAuthed(session);
  else showLoggedOut();
});
</script>
<script>
// All three training days from the plan. Each `ex` entry references an
// exercise in the EXERCISES registry (exercises.js) by `id` — the shared
// name/scheme/cue/tg/howto live there, so the same movement can appear in
// multiple days without duplicating its data. `n` is this day's display
// number (position), and `sets` is this day's set count for that exercise —
// both stay per-day since the same exercise can be programmed differently
// across days. To edit a workout, edit the `ex` array for that day; to change
// an exercise's own details (including the muscles its card highlights), edit
// it in exercises.js.
const DAYS = {
  1: {
    title: "Day 1 — Full-Body",
    sub: "Machine-focused · 2–3 reps in reserve · knee-conscious",
    ex: [
      { n: "1",  id: "lat_pulldown",       sets: 3 },
      { n: "2",  id: "chest_press",        sets: 3 },
      { n: "3",  id: "hip_thrust",         sets: 3 },
      { n: "4",  id: "lying_leg_curl",     sets: 3 },
      { n: "5",  id: "reverse_pec_deck",   sets: 2 },
      { n: "6",  id: "overhead_press",     sets: 2 },
      { n: "7",  id: "leg_extension",      sets: 2 },
      { n: "8",  id: "hip_abductor",       sets: 2 },
      { n: "9",  id: "hip_adductor",       sets: 2 },
      { n: "10A", id: "biceps_curl",       sets: 2 },
      { n: "10B", id: "triceps_extension", sets: 2 },
      { n: "11", id: "pallof_press",       sets: 3 },
    ],
  },
  2: {
    title: "Day 2 — Push/Pull + Posterior",
    sub: "Back/posture emphasis · pull-biased · knee-conscious",
    ex: [
      { n: "1",  id: "chest_supported_row", sets: 3 },
      { n: "2",  id: "incline_chest_press", sets: 3 },
      { n: "3",  id: "back_extension",      sets: 3 },
      { n: "4",  id: "seated_leg_curl",     sets: 3 },
      { n: "5",  id: "pullover",            sets: 2 },
      { n: "6",  id: "lateral_raise",       sets: 2 },
      { n: "7",  id: "calf_raise",          sets: 3 },
      { n: "8",  id: "hip_abductor",        sets: 2 },
      { n: "9",  id: "face_pull",           sets: 2 },
      { n: "10A", id: "hammer_curl",        sets: 2 },
      { n: "10B", id: "rope_pressdown",     sets: 2 },
      { n: "11", id: "side_plank",          sets: 3 },
    ],
  },
  3: {
    title: "Day 3 — Strength + Control",
    sub: "Balanced push/pull · glute & quad control · low impact",
    ex: [
      { n: "1",  id: "high_row",            sets: 3 },
      { n: "2",  id: "shoulder_press",      sets: 3 },
      { n: "3",  id: "hip_thrust",          sets: 3 },
      { n: "4",  id: "leg_extension",       sets: 2 },
      { n: "5",  id: "pec_deck",            sets: 2 },
      { n: "6",  id: "cable_row",           sets: 2 },
      { n: "7",  id: "seated_calf_raise",   sets: 3 },
      { n: "8",  id: "cable_hip_extension", sets: 2 },
      { n: "9",  id: "hip_adductor",        sets: 2 },
      { n: "10A", id: "biceps_curl",        sets: 2 },
      { n: "10B", id: "triceps_extension",  sets: 2 },
      { n: "11", id: "dead_bug",            sets: 3 },
    ],
  },
  4: {
    title: "Core A — Stability",
    sub: "2–3 rounds · 30–45s rest between exercises",
    ex: [
      { n: "1", id: "cat_camel",            sets: 1 },
      { n: "2", id: "dead_bug",             sets: 3 },
      { n: "3", id: "bird_dog",             sets: 3 },
      { n: "4", id: "side_plank_core",      sets: 3 },
      { n: "5", id: "glute_bridge_core",    sets: 3 },
      { n: "6", id: "front_plank",          sets: 3 },
      { n: "7", id: "prone_back_extension", sets: 3 },
    ],
  },
  5: {
    title: "Core B — Oblique Emphasis",
    sub: "2–3 rounds · 30–45s rest between exercises",
    ex: [
      { n: "1", id: "cat_camel",            sets: 1 },
      { n: "2", id: "dead_bug",             sets: 3 },
      { n: "3", id: "side_plank_core",      sets: 3 },
      { n: "4", id: "bird_dog",             sets: 3 },
      { n: "5", id: "slow_russian_twist",   sets: 3 },
      { n: "6", id: "glute_bridge_core",    sets: 3 },
      { n: "7", id: "prone_back_extension", sets: 3 },
    ],
  },
};

// Merge a day's `ex` list (n/id/sets/img) with its EXERCISES registry entry
// (name/scheme/cue/tg/howto) into the flat shape the rest of the app expects.
function resolveDay(day) {
  return day.ex.map((e) => Object.assign({}, EXERCISES[e.id], e));
}

// Which day is showing. Restored from localStorage so it reopens where you left off.
let currentDay = +(localStorage.getItem("gym-current-day")) || 1;
// Resolved (registry-merged) exercise list for the current day — this is what
// render() and friends iterate over. Not to be confused with the EXERCISES
// registry in exercises.js, which is keyed by id.
let dayExercises = resolveDay(DAYS[currentDay]);

const storeKey = (day) => `gym-day${day}-v1`;
const historyKey = (day) => `gym-day${day}-history-v1`;

function cloudReady() {
  return window.__supabase && window.__gymUserId;
}

// ---- Supabase (source of truth) with localStorage as a read-through cache ----
// Every read tries Supabase first so multiple devices stay in sync; if the
// network is down (e.g. bad signal at the gym), we fall back to whatever was
// last cached so the app still opens with the last-known data. Every write
// goes straight to Supabase, and the cache is updated alongside it purely so
// the next offline load has something to show.

// state: { sets: { "0": true }, log: { "0": {w:"", r:""} }, date: "YYYY-MM-DD" }
// — per day; sets[i] is whether exercise i is marked done (not per-set anymore).
// `date` is the day the session was last touched (stamped in save()).
let state = { sets: {}, log: {} };

// A live session only lasts for the day it was worked on. If the loaded session
// was last touched before today, it's stale: clear the done-marks and logged
// numbers so the next session starts fresh. (Finished data is already safe in
// history.) Returns a usable { sets, log } either way.
function freshenState(s) {
  if (!s || s.date !== localISODate()) return { sets: {}, log: {} };
  return s;
}

function cacheGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function cacheSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

// ---- Pending-writes queue ----
// A write that fails (no signal, mid-gym) is queued here instead of being
// silently dropped. Flushed on app load and whenever the browser comes back
// online; each queued op replays in order and is removed only on success. If
// a replay fails, we stop (rather than skip it) so ordering is preserved —
// e.g. a session upsert should land before the next one overwrites it.
const QUEUE_KEY = "gym-pending-writes-v1";

function queueGet() {
  const q = cacheGet(QUEUE_KEY);
  return Array.isArray(q) ? q : [];
}
function queueAdd(op) {
  const q = queueGet();
  q.push(op);
  cacheSet(QUEUE_KEY, q);
}

async function runOp(op) {
  if (op.type === "session") {
    await window.__supabase.from("workout_sessions").upsert(op.payload, { onConflict: "user_id,day" });
  } else if (op.type === "historyInsert") {
    if (op.payload.rows.length) await window.__supabase.from("workout_history").insert(op.payload.rows);
  } else if (op.type === "historyReplace") {
    await window.__supabase.from("workout_history").delete()
      .eq("user_id", op.payload.user_id).eq("day", op.payload.day);
    if (op.payload.rows.length) await window.__supabase.from("workout_history").insert(op.payload.rows);
  }
}

let queueFlushing = false;
async function flushQueue() {
  if (queueFlushing || !cloudReady()) return;
  queueFlushing = true;
  try {
    let q = queueGet();
    while (q.length) {
      try {
        await runOp(q[0]);
      } catch {
        break; // still offline (or a real error) — stop, keep the rest queued
      }
      q = q.slice(1);
      cacheSet(QUEUE_KEY, q);
    }
  } finally {
    queueFlushing = false;
  }
}
window.addEventListener("online", flushQueue);

// Loads the live session for `day` from Supabase, falling back to cache on
// failure. Always returns a usable { sets, log } object.
async function load(day = currentDay) {
  if (cloudReady()) {
    try {
      const { data, error } = await window.__supabase
        .from("workout_sessions")
        .select("state")
        .eq("user_id", window.__gymUserId)
        .eq("day", day)
        .maybeSingle();
      if (!error) {
        const s = freshenState(data?.state);
        cacheSet(storeKey(day), s);
        return s;
      }
    } catch {}
  }
  return freshenState(cacheGet(storeKey(day)));
}

let sessionPushTimer = null;
// Writes the live session for `day` to Supabase (debounced — this fires on
// every keystroke) and refreshes the cache immediately. Queues for retry on
// failure rather than losing the write.
function save(day = currentDay, s = state) {
  // Stamp the session with the day it was last touched so a stale session
  // (from a previous day) gets cleared on next load — see freshenState().
  s.date = localISODate();
  cacheSet(storeKey(day), s);
  if (!cloudReady()) return;
  clearTimeout(sessionPushTimer);
  sessionPushTimer = setTimeout(async () => {
    const payload = {
      user_id: window.__gymUserId,
      day,
      state: s,
      updated_at: new Date().toISOString(),
    };
    try {
      const { error } = await window.__supabase.from("workout_sessions")
        .upsert(payload, { onConflict: "user_id,day" });
      if (error) throw error;
    } catch {
      queueAdd({ type: "session", payload });
    }
  }, 500);
}

// ---- Workout history (progression) ----
// Local shape: an array of finished sessions per day —
//   [{ date: "2026-07-31", entries: { "1": {w:"40", r:"10"}, ... } }, ...]
// Supabase shape: one row per (user, day, date, exercise_num) in
// `workout_history`, flattened for easy querying; reassembled into the local
// shape on load. Keyed by exercise NUMBER (ex.n), not array index, so it
// survives reordering or edits to a day's `ex` list.
async function loadHistory(day = currentDay) {
  if (cloudReady()) {
    try {
      const { data, error } = await window.__supabase
        .from("workout_history")
        .select("date, exercise_num, weight, reps")
        .eq("user_id", window.__gymUserId)
        .eq("day", day)
        .order("date", { ascending: true });
      if (!error) {
        const byDate = {};
        (data || []).forEach((r) => {
          (byDate[r.date] = byDate[r.date] || {})[r.exercise_num] =
            { w: r.weight ?? "", r: r.reps ?? "" };
        });
        const hist = Object.keys(byDate).sort().map((date) => ({ date, entries: byDate[date] }));
        cacheSet(historyKey(day), hist);
        return hist;
      }
    } catch {}
  }
  const cached = cacheGet(historyKey(day));
  return Array.isArray(cached) ? cached : [];
}

// Caches the full history array (local shape) for a day. Used by "Finish
// workout"; the cloud push of the new session is done separately by
// pushHistorySession() so only the newly-added rows are sent.
function saveHistory(hist, day = currentDay) {
  cacheSet(historyKey(day), hist);
}

// Pushes one finished session's rows to Supabase; queues for retry on
// failure so the data isn't lost if you're offline at the gym.
async function pushHistorySession(day, date, entries) {
  if (!cloudReady()) return;
  const rows = Object.keys(entries).map((exNum) => ({
    user_id: window.__gymUserId,
    day,
    date,
    exercise_num: exNum,
    weight: entries[exNum].w,
    reps: entries[exNum].r,
  }));
  try {
    if (rows.length) {
      const { error } = await window.__supabase.from("workout_history").insert(rows);
      if (error) throw error;
    }
  } catch (err) {
    queueAdd({ type: "historyInsert", payload: { rows } });
    throw err;
  }
}

// Replaces all of a day's history rows in Supabase with `hist` (local shape),
// reconstructing them wholesale rather than appending. Queues for retry on
// failure. Currently unused (the CSV import that called it was removed) — kept
// as a building block for a future "replace a day's history" action.
async function replaceHistory(day, hist) {
  if (!cloudReady()) return;
  const rows = [];
  hist.forEach((session) => {
    Object.keys(session.entries).forEach((exNum) => {
      rows.push({
        user_id: window.__gymUserId,
        day,
        date: session.date,
        exercise_num: exNum,
        weight: session.entries[exNum].w,
        reps: session.entries[exNum].r,
      });
    });
  });
  try {
    const { error: delErr } = await window.__supabase.from("workout_history").delete()
      .eq("user_id", window.__gymUserId).eq("day", day);
    if (delErr) throw delErr;
    if (rows.length) {
      const { error } = await window.__supabase.from("workout_history").insert(rows);
      if (error) throw error;
    }
  } catch (err) {
    queueAdd({ type: "historyReplace", payload: { user_id: window.__gymUserId, day, rows } });
    throw err;
  }
}

let history = [];

// Sessions in which a given exercise (by number) has a logged weight or reps, oldest first.
function historyFor(exNum) {
  return history
    .filter((s) => s.entries[exNum] && (s.entries[exNum].w || s.entries[exNum].r))
    .map((s) => ({ date: s.date, w: s.entries[exNum].w, r: s.entries[exNum].r }));
}
// The most recent logged session for an exercise, or null.
function lastFor(exNum) {
  const h = historyFor(exNum);
  return h.length ? h[h.length - 1] : null;
}

// Switch the visible day: persist choice, reload that day's exercises + progress.
// Renders instantly from cache, then re-renders once the Supabase fetch
// resolves (so switching days on a slow connection isn't a blank screen).
async function selectDay(day) {
  currentDay = day;
  localStorage.setItem("gym-current-day", day);
  dayExercises = resolveDay(DAYS[day]);
  document.getElementById("dayTitle").textContent = DAYS[day].title;
  document.getElementById("daySub").textContent = DAYS[day].sub;
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("on", +t.dataset.day === day));

  state = freshenState(cacheGet(storeKey(day)));
  const cachedHist = cacheGet(historyKey(day));
  history = Array.isArray(cachedHist) ? cachedHist : [];
  render();

  const loadToken = (selectDay.__token = day + ":" + Date.now());
  const [freshState, freshHistory] = await Promise.all([load(day), loadHistory(day)]);
  if (selectDay.__token !== loadToken || currentDay !== day) return; // a newer selectDay ran meanwhile
  state = freshState;
  history = freshHistory;
  render();
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (tab) selectDay(+tab.dataset.day);
});

const list = document.getElementById("list");

// Link to the machine on Technogym. Prefer an exact product URL (`ex.tg`) when
// the exercise has one; otherwise fall back to a Google site-search. The direct
// URLs are verified en-US product pages — Technogym blocks bots and occasionally
// restructures URLs, so if one 404s, remove its `tg:` field to revert that
// exercise to the always-resolving search link below.
function technogymQuery(name) {
  let q = name
    .split("/")[0]                       // keep the primary machine, drop alternates
    .replace(/\(.*?\)/g, "")             // drop parenthetical notes
    .replace(/\b(Machine|Seated|Lying|Standing|Neutral-Grip|Reverse)\b/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  // If stripping left too little (e.g. "Machine Hammer / … Curl" → "Hammer"),
  // fall back to the fuller name minus just the parenthetical/alternate.
  if (q.split(" ").length < 2) {
    q = name.replace(/\(.*?\)/g, "").replace(/\s*\/.*$/, "").trim();
  }
  return q;
}
function technogymSearchLink(name) {
  const q = `${technogymQuery(name)} site:technogym.com/de-DE`;
  return "https://www.google.com/search?q=" + encodeURIComponent(q);
}
// Returns { href, label } for the reference link on a card. Prefers an exact
// URL (`ex.tg`); the label depends on where it points — most are Technogym
// product pages, but bodyweight moves link to an exercise how-to elsewhere
// (e.g. ACE Fitness). Falls back to a Technogym Google search when no URL.
function technogymLink(ex) {
  if (!ex.tg) return { href: technogymSearchLink(ex.name), label: "Find this machine on Technogym ↗" };
  const isTechnogym = /(^|\.)technogym\.com$/i.test(new URL(ex.tg).hostname);
  return {
    href: ex.tg,
    label: isTechnogym ? "View this machine on Technogym ↗" : "See how to do this exercise ↗",
  };
}

// The single best "see the movement" link for an exercise, surfaced as the
// prominent demo button on each card. We can't embed real exercise animations
// (the good ones are all copyrighted / would break offline use — see CLAUDE.md),
// so the next-best "correct way to do it" is a one-tap link to a real demo.
// Order of preference: a curated how-to page (`ex.howto`, mostly ACE Fitness
// with a demo video) → a `tg` link that is itself a how-to page (bodyweight
// moves point `tg` at ACE) → a YouTube form-video search (always resolves).
// Always returns a link, so every card gets a demo button.
function movementDemoLink(ex) {
  if (ex.howto) return { href: ex.howto, label: "Watch how to do it" };
  const tgIsHowto = ex.tg && !/(^|\.)technogym\.com$/i.test(new URL(ex.tg).hostname);
  if (tgIsHowto) return { href: ex.tg, label: "Watch how to do it" };
  const q = `${ex.name} proper form technique`;
  return { href: "https://www.youtube.com/results?search_query=" + encodeURIComponent(q),
           label: "Watch form videos" };
}

// The machine reference link for the secondary row — but only when it's a real
// Technogym machine page, not a how-to (the how-to is already surfaced as the
// prominent demo button, so we don't want to repeat it here). Returns null when
// there's no distinct machine page to show (bodyweight moves, or a `tg` that is
// itself a how-to page).
function machineRefLink(ex) {
  // Bodyweight moves have no machine — don't offer a "find this machine" search.
  if (ex.bodyweight) return null;
  // A `tg` pointing at a how-to page (not technogym.com) is the demo, already
  // shown above as the prominent button — skip it here to avoid duplication.
  if (ex.tg && !/(^|\.)technogym\.com$/i.test(new URL(ex.tg).hostname)) return null;
  return technogymLink(ex);
}

// ---- Anatomical muscle map ----
// Each card shows which muscles an exercise trains on an anatomical body figure,
// instead of a photo of the machine. Two real male-anatomy silhouettes — a front
// and a back view — are drawn from the per-region SVG path data in body-paths.js
// (MM_FRONT_PATHS / MM_BACK_PATHS, sourced from the MIT-licensed
// react-native-body-highlighter; see that file's header). Every region renders
// dim (var(--mm-base)) to form the body; muscleMapSVG() then redraws an
// exercise's primary movers bright (accent) and secondary/assisting muscles a
// mid green on top. The view(s) shown are chosen automatically from where the
// lit muscles sit, so nothing needs declaring per exercise beyond its
// `muscles: { primary, secondary }` list in exercises.js.
//
// Human-readable labels for the muscle keys used in exercises.js — shown as
// named chips under the figure so the highlighted regions are unambiguous.
const MUSCLE_LABELS = {
  chest: "Chest", front_delts: "Front delts", side_delts: "Side delts",
  rear_delts: "Rear delts", biceps: "Biceps", triceps: "Triceps",
  forearms: "Forearms", abs: "Abs", obliques: "Obliques", quads: "Quads",
  adductors: "Inner thigh", lats: "Lats", traps: "Traps", mid_back: "Mid-back",
  lower_back: "Lower back", glutes: "Glutes", hamstrings: "Hamstrings",
  calves: "Calves",
};

// Maps each app muscle key to a body view ("front"/"back") and the region slug
// used in body-paths.js. The source anatomy is coarser than our keys in a couple
// of places — front/side/rear delts all resolve to "deltoids", and lats/mid-back
// both to "upper-back" — so several keys can point at the same region; the lit
// legend still names them precisely.
const MM_REGION = {
  chest:       { view: "front", slug: "chest" },
  front_delts: { view: "front", slug: "deltoids" },
  side_delts:  { view: "front", slug: "deltoids" },
  biceps:      { view: "front", slug: "biceps" },
  forearms:    { view: "front", slug: "forearm" },
  abs:         { view: "front", slug: "abs" },
  obliques:    { view: "front", slug: "obliques" },
  quads:       { view: "front", slug: "quadriceps" },
  adductors:   { view: "front", slug: "adductors" },
  traps:       { view: "back",  slug: "trapezius" },
  rear_delts:  { view: "back",  slug: "deltoids" },
  lats:        { view: "back",  slug: "upper-back" },
  mid_back:    { view: "back",  slug: "upper-back" },
  triceps:     { view: "back",  slug: "triceps" },
  lower_back:  { view: "back",  slug: "lower-back" },
  glutes:      { view: "back",  slug: "gluteal" },
  hamstrings:  { view: "back",  slug: "hamstring" },
  calves:      { view: "back",  slug: "calves" },
};

// Build one body figure. `paths` is MM_FRONT_PATHS or MM_BACK_PATHS; `litSlugs`
// maps region slug -> "primary" | "secondary". Every region is drawn once in the
// base fill (so the whole body shows), then lit regions are redrawn on top in
// their highlight colour. The source canvas is 724×1448 with the back view
// offset +724 on x, so each view keeps its own half as the viewBox.
function mmFigure(paths, viewBox, litSlugs, label) {
  let body = "", lit = "";
  Object.keys(paths).forEach((slug) => {
    paths[slug].forEach((d) => { body += `<path class="mm-base-fill" d="${d}"/>`; });
  });
  Object.keys(litSlugs).forEach((slug) => {
    const cls = litSlugs[slug] === "primary" ? "mm-lit" : "mm-lit2";
    (paths[slug] || []).forEach((d) => { lit += `<path class="${cls}" d="${d}"/>`; });
  });
  return `<figure class="mm-fig"><svg viewBox="${viewBox}" role="img" aria-label="${label} view">`
    + `${body}${lit}</svg><figcaption>${label}</figcaption></figure>`;
}

// Returns an inline-SVG muscle map for an exercise, or "" if it has no `muscles`
// data. Lights primary movers bright and secondary muscles mid; shows the front
// view, the back view, or both depending on where the lit muscles sit.
function muscleMapSVG(ex) {
  const m = ex.muscles;
  if (!m) return "";
  const primary = m.primary || [];
  const secondary = m.secondary || [];
  const level = {}; // muscle key -> "primary" | "secondary" (primary wins)
  secondary.forEach((k) => { level[k] = "secondary"; });
  primary.forEach((k) => { level[k] = "primary"; });
  const keys = Object.keys(level);
  if (!keys.length) return "";

  // Resolve app keys to region slugs, split by view. When two keys hit the same
  // slug (e.g. front_delts + side_delts → deltoids), primary wins.
  const frontLit = {}, backLit = {};
  keys.forEach((k) => {
    const r = MM_REGION[k];
    if (!r) return;
    const target = r.view === "front" ? frontLit : backLit;
    if (level[k] === "primary" || !target[r.slug]) target[r.slug] = level[k];
  });

  let figs = "";
  if (Object.keys(frontLit).length) figs += mmFigure(MM_FRONT_PATHS, "0 0 724 1448", frontLit, "Front");
  if (Object.keys(backLit).length) figs += mmFigure(MM_BACK_PATHS, "724 0 724 1448", backLit, "Back");

  // Legend: primary muscles first (bold), then secondary (muted), named.
  const chip = (k, isPrimary) =>
    `<span class="mm-chip ${isPrimary ? "p" : "s"}">${MUSCLE_LABELS[k] || k}</span>`;
  const legend = primary.map((k) => chip(k, true)).join("")
    + secondary.filter((k) => MUSCLE_LABELS[k]).map((k) => chip(k, false)).join("");

  return `<div class="mm">${figs}</div><div class="mm-legend">${legend}</div>`;
}

// Build an inline-SVG line chart of progress over time for one exercise:
// top-set weight for weighted exercises, reps for bodyweight ones. Single
// series → no legend (the card title names it); recessive grid; thin accent
// line with visible dots. Entries that don't parse as numbers are skipped.
function progressChartSVG(ex) {
  const unit = ex.bodyweight ? "" : "kg";
  const field = ex.bodyweight ? "r" : "w";
  const pts = historyFor(ex.n)
    .map((s) => ({ date: s.date, y: parseFloat(s[field]) }))
    .filter((p) => !isNaN(p.y));

  if (pts.length === 0) return `<p class="prog-empty">No numeric ${ex.bodyweight ? "reps" : "weight"} logged yet.</p>`;
  if (pts.length === 1) {
    const p = pts[0];
    return `<p class="prog-empty">Only one session so far: <b>${p.y}${unit}</b> on ${p.date}. Finish another to see a trend.</p>`;
  }

  // viewBox coords; CSS scales width to the card. Padding leaves room for labels.
  const W = 320, H = 160, padL = 34, padR = 10, padT = 12, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const ys = pts.map((p) => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; } // flat line → give it a band
  const x = (i) => padL + (pts.length === 1 ? plotW / 2 : (i / (pts.length - 1)) * plotW);
  const y = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;

  // Horizontal grid + y labels at min / mid / max.
  const gridVals = [min, (min + max) / 2, max];
  const grid = gridVals.map((v) => {
    const gy = y(v).toFixed(1);
    return `<line class="prog-grid" x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}"/>` +
           `<text class="prog-axis" x="${padL - 4}" y="${(+gy + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  }).join("");

  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const dots = pts.map((p, i) =>
    `<circle class="prog-dot" cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4">` +
    `<title>${p.date}: ${p.y}${unit}${ex.bodyweight ? " reps" : ""}</title></circle>`).join("");

  // Date labels: first and last only, to avoid crowding on narrow phones.
  const short = (d) => d.slice(5); // MM-DD
  const xLabels =
    `<text class="prog-axis" x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="start">${short(pts[0].date)}</text>` +
    `<text class="prog-axis" x="${x(pts.length - 1).toFixed(1)}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].date)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ex.bodyweight ? "Reps" : "Top-set weight"} over time">` +
    grid +
    `<polyline class="prog-line" points="${line}"/>` +
    dots + xLabels +
    `</svg>`;
}

function render() {
  list.innerHTML = "";
  dayExercises.forEach((ex, i) => {
    const complete = isDone(i);

    const card = document.createElement("div");
    card.className = "exercise" + (complete ? " done" : "");

    const doneBtn = `<button class="set-btn ${complete ? "on" : ""}" data-ex="${i}">${complete ? "✓ Done" : "Mark done"}</button>`;

    if (!state.log[i] && ex.defaultWeight) state.log[i] = { w: ex.defaultWeight };
    const log = state.log[i] || {};
    const demo = movementDemoLink(ex);   // prominent "watch the movement" button
    const machine = machineRefLink(ex);  // subtle machine-page link (null if none)
    const last = lastFor(ex.n);
    const lastHint = last
      ? ex.bodyweight
        ? `Last time: <b>${last.r} reps</b> <span style="opacity:.7">(${last.date})</span>`
        : `Last time: <b>${last.w}${/\d$/.test(last.w) ? "kg" : ""}${last.r ? " × " + last.r : ""}</b> <span style="opacity:.7">(${last.date})</span>`
      : "No history yet — finish a workout to start tracking.";
    card.innerHTML = `
      <div class="ex-img">
        ${muscleMapSVG(ex) || '<span class="ex-img-ph">Muscles coming soon</span>'}
      </div>
      <a class="demo-btn" href="${demo.href}" target="_blank" rel="noopener noreferrer">
        <span class="demo-play" aria-hidden="true">▶</span>
        <span>${demo.label}</span>
        <span class="demo-ext" aria-hidden="true">↗</span>
      </a>
      <div class="ex-head">
        <span class="ex-num">${ex.n}</span>
        <span class="ex-name">${ex.name}</span>
        ${complete ? '<span class="done-badge">✓ done</span>' : ""}
      </div>
      <div class="ex-meta">${ex.scheme}</div>
      <div class="cue">${ex.cue}</div>
      ${machine ? `<div class="ref-links">
        <a class="tg-link" href="${machine.href}" target="_blank" rel="noopener noreferrer">${machine.label}</a>
      </div>` : ""}
      <div class="sets">${doneBtn}</div>
      <div class="log">
        ${ex.bodyweight ? "" : `<input type="text" inputmode="decimal" placeholder="Weight" data-log="w" data-ex="${i}" value="${log.w || ""}">`}
        <input type="text" inputmode="numeric" placeholder="Reps" data-log="r" data-ex="${i}" value="${log.r ?? "10"}">
      </div>
      <p class="last-hint">${lastHint}</p>
      <button class="prog-toggle" data-prog="${i}" aria-expanded="false">📈 Progress</button>
      <div class="prog-panel" data-panel="${i}" hidden></div>`;
    list.appendChild(card);
  });
  updateProgress();
}

function isDone(i) {
  return !!state.sets[i];
}

function updateProgress() {
  const done = dayExercises.filter((_, i) => isDone(i)).length;
  const total = dayExercises.length;
  const pct = Math.round((done / total) * 100);
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent =
    `${done} of ${total} exercises done${done === total ? " — session complete 💪" : ""}`;
}

// Event delegation
list.addEventListener("click", (e) => {
  // Progress chart toggle — build the SVG lazily on first open.
  const prog = e.target.closest(".prog-toggle");
  if (prog) {
    const i = prog.dataset.prog;
    const panel = list.querySelector(`[data-panel="${i}"]`);
    const open = panel.hidden;
    if (open && !panel.dataset.built) {
      panel.innerHTML = progressChartSVG(dayExercises[i]);
      panel.dataset.built = "1";
    }
    panel.hidden = !open;
    prog.setAttribute("aria-expanded", String(open));
    prog.textContent = open ? "📉 Hide progress" : "📈 Progress";
    return;
  }

  const btn = e.target.closest(".set-btn");
  if (!btn) return;
  const i = btn.dataset.ex;
  state.sets[i] = !state.sets[i];
  save();
  render();
});

list.addEventListener("input", (e) => {
  const inp = e.target.closest("input[data-log]");
  if (!inp) return;
  const i = inp.dataset.ex;
  state.log[i] = state.log[i] || {};
  state.log[i][inp.dataset.log] = inp.value;
  save();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Clear all checked sets and logged weights?")) {
    state = { sets: {}, log: {} };
    save();
    render();
  }
});

// YYYY-MM-DD in the user's local timezone (toISOString would give the UTC date,
// which is off by one shortly after midnight east of Greenwich).
function localISODate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Finish workout: snapshot every exercise that has a logged weight (or, for
// bodyweight exercises, logged reps) into history, then clear the live
// session so the next one starts fresh. Keyed by ex.n.
document.getElementById("finishBtn").addEventListener("click", async () => {
  const entries = {};
  dayExercises.forEach((ex, i) => {
    const log = state.log[i] || {};
    const w = (log.w || "").trim();
    const r = (log.r ?? "").toString().trim();
    if (ex.bodyweight ? r !== "" : w !== "") entries[ex.n] = { w, r: r || "10" };
  });
  const count = Object.keys(entries).length;
  if (count === 0) {
    alert("Log a weight or rep count on at least one exercise before finishing.");
    return;
  }
  if (!confirm(`Save this workout (${count} exercise${count > 1 ? "s" : ""}) to history and start fresh?`)) return;

  const today = localISODate();
  const day = currentDay;
  history.push({ date: today, entries });
  saveHistory(history, day);

  state = { sets: {}, log: {} };
  save(day, state);
  render();

  try {
    await pushHistorySession(day, today, entries);
    alert("Saved to history 💪 Your next session starts fresh.");
  } catch {
    alert("Saved locally, but couldn't reach the server — it'll retry next time you're online.");
  }
});

window.__gymAppInit = () => {
  if (window.__gymAppStarted) return;
  window.__gymAppStarted = true;
  selectDay(currentDay);
  flushQueue();
};
</script>
</body>
