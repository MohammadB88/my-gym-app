<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Tracker — 3-Day Plan</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #22262f;
    --text: #e6e8ec;
    --muted: #9aa0ac;
    --accent: #4ade80;
    --accent-dim: #2a3b30;
    --line: #2c313b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 0 auto;
    /* Respect the notch / rounded corners on modern phones */
    padding: 12px max(14px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  header { margin-bottom: 8px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; }

  /* Day selector tabs */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 2px; }
  .tab {
    min-height: 44px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card2); color: var(--muted);
    font-size: 0.9rem; font-weight: 600; touch-action: manipulation;
  }
  .tab.on { background: var(--accent); color: #0b1f14; border-color: var(--accent); }
  .tab:active { transform: scale(0.98); }

  .progress-wrap {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 12px 0 10px;
    /* Cover the gap that appears when the card scrolls under the sticky bar */
    box-shadow: 0 8px 8px -4px var(--bg);
  }
  .bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .progress-label { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }

  .exercise {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 10px;
    margin-bottom: 12px;
    overflow-wrap: break-word;
  }
  .exercise.done { border-color: var(--accent-dim); }

  .ex-img {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    max-height: 200px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    background: var(--card2);
  }
  .ex-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Placeholder is hidden by default; shown only when the <img> fails to load */
  .ex-img-ph { display: none; }
  .ex-img.missing {
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg, var(--card2) 0 12px, #1e222b 12px 24px);
    border: 1px dashed var(--line);
  }
  .ex-img.missing .ex-img-ph {
    display: block; color: var(--muted); font-size: 0.8rem; letter-spacing: .02em;
  }
  .ex-head { display: flex; align-items: baseline; gap: 8px; }
  .ex-num {
    font-size: 0.75rem; font-weight: 700; color: var(--accent);
    background: var(--accent-dim); padding: 2px 7px; border-radius: 6px; flex: none;
  }
  .ex-name { font-weight: 600; font-size: 1rem; line-height: 1.25; }
  .ex-meta { color: var(--muted); font-size: 0.8rem; margin: 6px 0 2px; }
  .cue { color: var(--muted); font-size: 0.78rem; line-height: 1.4; margin: 8px 0 10px; }
  /* Reference links (machine page + how-to). Stack on their own rows so both
     stay tappable on narrow screens. */
  .ref-links { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
  .tg-link {
    display: inline-block; align-self: flex-start;
    color: var(--accent); font-size: 0.78rem; text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .tg-link:hover { border-bottom-color: var(--accent); }

  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .set-btn {
    min-width: 120px; height: 46px; padding: 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card2);
    color: var(--muted); font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all .12s ease; touch-action: manipulation;
  }
  .set-btn.on {
    background: var(--accent); color: #0b1f14; border-color: var(--accent);
  }

  .log { display: flex; gap: 8px; }
  .log input {
    flex: 1; min-width: 0;
    background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 12px;
    /* 16px prevents iOS Safari from auto-zooming when the field is focused */
    font-size: 16px;
  }
  .log input::placeholder { color: #6b717d; }
  .log input:focus { outline: none; border-color: var(--accent); }

  /* "Last time you did this" hint, read from workout history */
  .last-hint { color: var(--muted); font-size: 0.78rem; margin: 8px 0 0; min-height: 1em; }
  .last-hint b { color: var(--text); font-weight: 600; }

  /* Per-exercise progression chart toggle + panel */
  .prog-toggle {
    display: inline-block; margin: 8px 0 0; padding: 0;
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.78rem; font-weight: 600;
    touch-action: manipulation;
  }
  .prog-panel { margin-top: 10px; }
  .prog-panel svg { width: 100%; height: auto; display: block; }
  .prog-empty { color: var(--muted); font-size: 0.78rem; margin: 8px 0 0; }
  /* Chart marks: recessive grid/axis, thin accent line, visible dots */
  .prog-grid { stroke: var(--line); stroke-width: 1; }
  .prog-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .prog-dot  { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .prog-axis { fill: var(--muted); font-size: 10px; }

  /* Two CSV buttons share the top row; Reset gets its own full-width row.
     Grid keeps this stable at every phone width — no overflow, no clipping. */
  .footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px; margin: 8px 0 24px;
  }
  .footer button {
    min-height: 48px; padding: 12px 8px; border-radius: 12px;
    border: 1px solid var(--line); font-size: 0.9rem; cursor: pointer;
    touch-action: manipulation; white-space: nowrap;
  }
  button.act { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  button.act:active { background: #33513e; }
  button.reset { background: var(--card); color: var(--muted); grid-column: 1 / -1; }
  button.reset:active { background: var(--card2); }
  .done-badge { color: var(--accent); font-size: 0.8rem; margin-left: auto; align-self: center; }
</style>
</head>
<body>
<header>
  <h1 id="dayTitle">Day 1 — Full-Body</h1>
  <p class="sub" id="daySub">Machine-focused · 2–3 reps in reserve · knee-conscious</p>
  <div class="tabs" id="tabs">
    <button class="tab" data-day="1">Day 1</button>
    <button class="tab" data-day="2">Day 2</button>
    <button class="tab" data-day="3">Day 3</button>
  </div>
</header>

<div class="progress-wrap">
  <div class="bar"><span id="barFill"></span></div>
  <p class="progress-label" id="progressLabel">&nbsp;</p>
</div>

<div id="list"></div>

<div class="footer">
  <button class="act" id="finishBtn" style="grid-column: 1 / -1; background: var(--accent); color: #0b1f14; border-color: var(--accent);">✓ Finish workout &amp; save to history</button>
  <button class="act" id="exportBtn">⬇ Export CSV</button>
  <button class="act" id="importBtn">⬆ Import CSV</button>
  <button class="reset" id="resetBtn">Reset</button>
  <input type="file" id="importFile" accept=".csv" hidden>
</div>

<script src="exercises.js"></script>
<script>
// All three training days from the plan. Each `ex` entry references an
// exercise in the EXERCISES registry (exercises.js) by `id` — the shared
// name/scheme/cue/tg/howto live there, so the same movement can appear in
// multiple days without duplicating its data. `n` is this day's display
// number (position), and `sets` is this day's set count for that exercise —
// both stay per-day since the same exercise can be programmed differently
// across days. `img` also stays per-day: the same machine is often
// photographed differently per day. To edit a workout, edit the `ex` array
// for that day; to change an exercise's own details, edit it in exercises.js.
const DAYS = {
  1: {
    title: "Day 1 — Full-Body",
    sub: "Machine-focused · 2–3 reps in reserve · knee-conscious",
    ex: [
      { n: "1",  id: "lat_pulldown",       sets: 3, img: "images/d1/01-lat-pulldown.jpg" },
      { n: "2",  id: "chest_press",        sets: 3, img: "images/d1/02-chest-press.jpg" },
      { n: "3",  id: "hip_thrust",         sets: 3, img: "images/d1/03-hip-thrust.jpg" },
      { n: "4",  id: "lying_leg_curl",     sets: 3, img: "images/d1/04-lying-leg-curl.jpg" },
      { n: "5",  id: "reverse_pec_deck",   sets: 2, img: "images/d1/05-reverse-pec-deck.jpg" },
      { n: "6",  id: "overhead_press",     sets: 2, img: "images/d1/06-overhead-press.jpg" },
      { n: "7",  id: "leg_extension",      sets: 2, img: "images/d1/07-leg-extension.jpg" },
      { n: "8",  id: "hip_abductor",       sets: 2, img: "images/d1/08-hip-abductor.jpg" },
      { n: "9",  id: "hip_adductor",       sets: 2, img: "images/d1/09-hip-adductor.jpg" },
      { n: "10A", id: "biceps_curl",       sets: 2, img: "images/d1/10a-biceps-curl.jpg" },
      { n: "10B", id: "triceps_extension", sets: 2, img: "images/d1/10b-triceps-extension.jpg" },
      { n: "11", id: "pallof_press",       sets: 3, img: "images/d1/11-pallof-press.jpg" },
    ],
  },
  2: {
    title: "Day 2 — Push/Pull + Posterior",
    sub: "Back/posture emphasis · pull-biased · knee-conscious",
    ex: [
      { n: "1",  id: "chest_supported_row", sets: 3, img: "images/d2/01-chest-supported-row.jpg" },
      { n: "2",  id: "incline_chest_press", sets: 3, img: "images/d2/02-incline-chest-press.jpg" },
      { n: "3",  id: "back_extension",      sets: 3, img: "images/d2/03-back-extension.jpg" },
      { n: "4",  id: "seated_leg_curl",     sets: 3, img: "images/d2/04-seated-leg-curl.jpg" },
      { n: "5",  id: "pullover",            sets: 2, img: "images/d2/05-pullover.jpg" },
      { n: "6",  id: "lateral_raise",       sets: 2, img: "images/d2/06-lateral-raise.jpg" },
      { n: "7",  id: "calf_raise",          sets: 3, img: "images/d2/07-calf-raise.jpg" },
      { n: "8",  id: "hip_abductor",        sets: 2, img: "images/d2/08-hip-abductor.jpg" },
      { n: "9",  id: "face_pull",           sets: 2, img: "images/d2/09-face-pull.jpg" },
      { n: "10A", id: "hammer_curl",        sets: 2, img: "images/d2/10a-hammer-curl.jpg" },
      { n: "10B", id: "rope_pressdown",     sets: 2, img: "images/d2/10b-rope-pressdown.jpg" },
      { n: "11", id: "side_plank",          sets: 3, img: "images/d2/11-side-plank.jpg" },
    ],
  },
  3: {
    title: "Day 3 — Strength + Control",
    sub: "Balanced push/pull · glute & quad control · low impact",
    ex: [
      { n: "1",  id: "high_row",            sets: 3, img: "images/d3/01-high-row.jpg" },
      { n: "2",  id: "shoulder_press",      sets: 3, img: "images/d3/02-shoulder-press.jpg" },
      { n: "3",  id: "hip_thrust",          sets: 3, img: "images/d3/03-hip-thrust.jpg" },
      { n: "4",  id: "leg_extension",       sets: 2, img: "images/d3/04-leg-extension.jpg" },
      { n: "5",  id: "pec_deck",            sets: 2, img: "images/d3/05-pec-deck.jpg" },
      { n: "6",  id: "cable_row",           sets: 2, img: "images/d3/06-cable-row.jpg" },
      { n: "7",  id: "seated_calf_raise",   sets: 3, img: "images/d3/07-seated-calf-raise.jpg" },
      { n: "8",  id: "cable_hip_extension", sets: 2, img: "images/d3/08-cable-hip-extension.jpg" },
      { n: "9",  id: "hip_adductor",        sets: 2, img: "images/d3/09-hip-adductor.jpg" },
      { n: "10A", id: "biceps_curl",        sets: 2, img: "images/d3/10a-biceps-curl.jpg" },
      { n: "10B", id: "triceps_extension",  sets: 2, img: "images/d3/10b-triceps-extension.jpg" },
      { n: "11", id: "dead_bug",            sets: 3, img: "images/d3/11-dead-bug.jpg" },
    ],
  },
};

// Merge a day's `ex` list (n/id/sets/img) with its EXERCISES registry entry
// (name/scheme/cue/tg/howto) into the flat shape the rest of the app expects.
function resolveDay(day) {
  return day.ex.map((e) => Object.assign({}, EXERCISES[e.id], e));
}

// Which day is showing. Restored from localStorage so it reopens where you left off.
let currentDay = +(localStorage.getItem("gym-current-day")) || 1;
// Resolved (registry-merged) exercise list for the current day — this is what
// render() and friends iterate over. Not to be confused with the EXERCISES
// registry in exercises.js, which is keyed by id.
let dayExercises = resolveDay(DAYS[currentDay]);

const storeKey = (day) => `gym-day${day}-v1`;

// state: { sets: { "0": true }, log: { "0": {w:"", r:""} } } — per day;
// sets[i] is whether exercise i is marked done (not per-set anymore).
let state = load();

function load() {
  try {
    return JSON.parse(localStorage.getItem(storeKey(currentDay))) || { sets: {}, log: {} };
  } catch { return { sets: {}, log: {} }; }
}
function save() { localStorage.setItem(storeKey(currentDay), JSON.stringify(state)); }

// ---- Workout history (progression) ----
// Per day, an array of finished sessions:
//   [{ date: "2026-07-31", entries: { "1": {w:"40", r:"10"}, ... } }, ...]
// Keyed by exercise NUMBER (ex.n), not array index, so it survives reordering
// or edits to a day's `ex` list. Separate localStorage key from live state.
const historyKey = (day) => `gym-day${day}-history-v1`;

function loadHistory(day = currentDay) {
  try {
    const h = JSON.parse(localStorage.getItem(historyKey(day)));
    return Array.isArray(h) ? h : [];
  } catch { return []; }
}
function saveHistory(hist, day = currentDay) {
  localStorage.setItem(historyKey(day), JSON.stringify(hist));
}
let history = loadHistory();

// Sessions in which a given exercise (by number) has a logged weight, oldest first.
function historyFor(exNum) {
  return history
    .filter((s) => s.entries[exNum] && s.entries[exNum].w !== "")
    .map((s) => ({ date: s.date, w: s.entries[exNum].w, r: s.entries[exNum].r }));
}
// The most recent logged session for an exercise, or null.
function lastFor(exNum) {
  const h = historyFor(exNum);
  return h.length ? h[h.length - 1] : null;
}

// Switch the visible day: persist choice, reload that day's exercises + progress.
function selectDay(day) {
  currentDay = day;
  localStorage.setItem("gym-current-day", day);
  dayExercises = resolveDay(DAYS[day]);
  state = load();
  history = loadHistory();
  document.getElementById("dayTitle").textContent = DAYS[day].title;
  document.getElementById("daySub").textContent = DAYS[day].sub;
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("on", +t.dataset.day === day));
  render();
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (tab) selectDay(+tab.dataset.day);
});

const list = document.getElementById("list");

// Link to the machine on Technogym. Prefer an exact product URL (`ex.tg`) when
// the exercise has one; otherwise fall back to a Google site-search. The direct
// URLs are verified en-US product pages — Technogym blocks bots and occasionally
// restructures URLs, so if one 404s, remove its `tg:` field to revert that
// exercise to the always-resolving search link below.
function technogymQuery(name) {
  let q = name
    .split("/")[0]                       // keep the primary machine, drop alternates
    .replace(/\(.*?\)/g, "")             // drop parenthetical notes
    .replace(/\b(Machine|Seated|Lying|Standing|Neutral-Grip|Reverse)\b/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  // If stripping left too little (e.g. "Machine Hammer / … Curl" → "Hammer"),
  // fall back to the fuller name minus just the parenthetical/alternate.
  if (q.split(" ").length < 2) {
    q = name.replace(/\(.*?\)/g, "").replace(/\s*\/.*$/, "").trim();
  }
  return q;
}
function technogymSearchLink(name) {
  const q = `${technogymQuery(name)} site:technogym.com/de-DE`;
  return "https://www.google.com/search?q=" + encodeURIComponent(q);
}
// Returns { href, label } for the reference link on a card. Prefers an exact
// URL (`ex.tg`); the label depends on where it points — most are Technogym
// product pages, but bodyweight moves link to an exercise how-to elsewhere
// (e.g. ACE Fitness). Falls back to a Technogym Google search when no URL.
function technogymLink(ex) {
  if (!ex.tg) return { href: technogymSearchLink(ex.name), label: "Find this machine on Technogym ↗" };
  const isTechnogym = /(^|\.)technogym\.com$/i.test(new URL(ex.tg).hostname);
  return {
    href: ex.tg,
    label: isTechnogym ? "View this machine on Technogym ↗" : "See how to do this exercise ↗",
  };
}

// Returns { href, label } for the "how to do this" link, or null if it would
// duplicate the machine link (bodyweight moves already point their tg link at a
// how-to page). Prefers an exact page (`ex.howto`, e.g. an ACE Fitness exercise-
// library page with a demo video); falls back to a YouTube search — which always
// resolves to current results even if a specific video is removed.
function howtoLink(ex) {
  // If the machine link already points at a how-to page (bodyweight moves link
  // their `tg` to ACE), don't add a second how-to link.
  const tgIsHowto = ex.tg && !/(^|\.)technogym\.com$/i.test(new URL(ex.tg).hostname);
  if (ex.howto) {
    if (ex.tg === ex.howto) return null;
    return { href: ex.howto, label: "▶ How to do this exercise ↗" };
  }
  if (tgIsHowto) return null;
  // No curated page: search YouTube for a form demo of this movement.
  const q = `${ex.name} proper form technique`;
  return { href: "https://www.youtube.com/results?search_query=" + encodeURIComponent(q),
           label: "▶ Watch form videos ↗" };
}

// Build an inline-SVG line chart of top-set weight over time for one exercise.
// Single series → no legend (the card title names it); recessive grid; thin
// accent line with visible dots. Numeric weights only; entries that don't parse
// as numbers are skipped (can't plot "bodyweight").
function progressChartSVG(exNum) {
  const pts = historyFor(exNum)
    .map((s) => ({ date: s.date, y: parseFloat(s.w) }))
    .filter((p) => !isNaN(p.y));

  if (pts.length === 0) return `<p class="prog-empty">No numeric weight logged yet.</p>`;
  if (pts.length === 1) {
    const p = pts[0];
    return `<p class="prog-empty">Only one session so far: <b>${p.y}kg</b> on ${p.date}. Finish another to see a trend.</p>`;
  }

  // viewBox coords; CSS scales width to the card. Padding leaves room for labels.
  const W = 320, H = 160, padL = 34, padR = 10, padT = 12, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const ys = pts.map((p) => p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; } // flat line → give it a band
  const x = (i) => padL + (pts.length === 1 ? plotW / 2 : (i / (pts.length - 1)) * plotW);
  const y = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;

  // Horizontal grid + y labels at min / mid / max.
  const gridVals = [min, (min + max) / 2, max];
  const grid = gridVals.map((v) => {
    const gy = y(v).toFixed(1);
    return `<line class="prog-grid" x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}"/>` +
           `<text class="prog-axis" x="${padL - 4}" y="${(+gy + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  }).join("");

  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const dots = pts.map((p, i) =>
    `<circle class="prog-dot" cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4">` +
    `<title>${p.date}: ${p.y}kg${p.r ? " × " + p.r : ""}</title></circle>`).join("");

  // Date labels: first and last only, to avoid crowding on narrow phones.
  const short = (d) => d.slice(5); // MM-DD
  const xLabels =
    `<text class="prog-axis" x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="start">${short(pts[0].date)}</text>` +
    `<text class="prog-axis" x="${x(pts.length - 1).toFixed(1)}" y="${H - 6}" text-anchor="end">${short(pts[pts.length - 1].date)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top-set weight over time">` +
    grid +
    `<polyline class="prog-line" points="${line}"/>` +
    dots + xLabels +
    `</svg>`;
}

function render() {
  list.innerHTML = "";
  dayExercises.forEach((ex, i) => {
    const complete = isDone(i);

    const card = document.createElement("div");
    card.className = "exercise" + (complete ? " done" : "");

    const doneBtn = `<button class="set-btn ${complete ? "on" : ""}" data-ex="${i}">${complete ? "✓ Done" : "Mark done"}</button>`;

    const log = state.log[i] || {};
    const tg = technogymLink(ex);
    const howto = howtoLink(ex);
    const last = lastFor(ex.n);
    const lastHint = last
      ? `Last time: <b>${last.w}${/\d$/.test(last.w) ? "kg" : ""}${last.r ? " × " + last.r : ""}</b> <span style="opacity:.7">(${last.date})</span>`
      : "No history yet — finish a workout to start tracking.";
    card.innerHTML = `
      <div class="ex-img">
        <img src="${ex.img}" alt="${ex.name}" loading="lazy"
             onerror="this.parentElement.classList.add('missing'); this.remove();">
        <span class="ex-img-ph">Image coming soon</span>
      </div>
      <div class="ex-head">
        <span class="ex-num">${ex.n}</span>
        <span class="ex-name">${ex.name}</span>
        ${complete ? '<span class="done-badge">✓ done</span>' : ""}
      </div>
      <div class="ex-meta">${ex.scheme}</div>
      <div class="cue">${ex.cue}</div>
      <div class="ref-links">
        <a class="tg-link" href="${tg.href}" target="_blank" rel="noopener noreferrer">${tg.label}</a>
        ${howto ? `<a class="tg-link" href="${howto.href}" target="_blank" rel="noopener noreferrer">${howto.label}</a>` : ""}
      </div>
      <div class="sets">${doneBtn}</div>
      <div class="log">
        <input type="text" inputmode="decimal" placeholder="Weight" data-log="w" data-ex="${i}" value="${log.w || ""}">
        <input type="text" inputmode="numeric" placeholder="Reps" data-log="r" data-ex="${i}" value="${log.r ?? "10"}">
      </div>
      <p class="last-hint">${lastHint}</p>
      <button class="prog-toggle" data-prog="${i}" aria-expanded="false">📈 Progress</button>
      <div class="prog-panel" data-panel="${i}" hidden></div>`;
    list.appendChild(card);
  });
  updateProgress();
}

function isDone(i) {
  return !!state.sets[i];
}

// Kept as an alias so CSV export (which reports sets_done/total_sets) still
// makes sense: an exercise is fully done (all its sets) or not done at all.
function countDone(i) {
  return isDone(i) ? dayExercises[i].sets : 0;
}

function updateProgress() {
  const done = dayExercises.filter((_, i) => isDone(i)).length;
  const total = dayExercises.length;
  const pct = Math.round((done / total) * 100);
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent =
    `${done} of ${total} exercises done${done === total ? " — session complete 💪" : ""}`;
}

// Event delegation
list.addEventListener("click", (e) => {
  // Progress chart toggle — build the SVG lazily on first open.
  const prog = e.target.closest(".prog-toggle");
  if (prog) {
    const i = prog.dataset.prog;
    const panel = list.querySelector(`[data-panel="${i}"]`);
    const open = panel.hidden;
    if (open && !panel.dataset.built) {
      panel.innerHTML = progressChartSVG(dayExercises[i].n);
      panel.dataset.built = "1";
    }
    panel.hidden = !open;
    prog.setAttribute("aria-expanded", String(open));
    prog.textContent = open ? "📉 Hide progress" : "📈 Progress";
    return;
  }

  const btn = e.target.closest(".set-btn");
  if (!btn) return;
  const i = btn.dataset.ex;
  state.sets[i] = !state.sets[i];
  save();
  render();
});

list.addEventListener("input", (e) => {
  const inp = e.target.closest("input[data-log]");
  if (!inp) return;
  const i = inp.dataset.ex;
  state.log[i] = state.log[i] || {};
  state.log[i][inp.dataset.log] = inp.value;
  save();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Clear all checked sets and logged weights?")) {
    state = { sets: {}, log: {} };
    save();
    render();
  }
});

// YYYY-MM-DD in the user's local timezone (toISOString would give the UTC date,
// which is off by one shortly after midnight east of Greenwich).
function localISODate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Finish workout: snapshot every exercise that has a logged weight into history,
// then clear the live session so the next one starts fresh. Keyed by ex.n.
document.getElementById("finishBtn").addEventListener("click", () => {
  const entries = {};
  dayExercises.forEach((ex, i) => {
    const log = state.log[i] || {};
    if ((log.w || "").trim() !== "") entries[ex.n] = { w: log.w.trim(), r: (log.r ?? "10").toString().trim() || "10" };
  });
  const count = Object.keys(entries).length;
  if (count === 0) {
    alert("Log a weight on at least one exercise before finishing.");
    return;
  }
  if (!confirm(`Save this workout (${count} exercise${count > 1 ? "s" : ""}) to history and start fresh?`)) return;

  const today = localISODate();
  history = loadHistory();
  history.push({ date: today, entries });
  saveHistory(history);

  state = { sets: {}, log: {} };
  save();
  render();
  alert("Saved to history 💪 Your next session starts fresh.");
});

// ---- CSV export / import ----
// One row per exercise: number, name, sets done, weight, reps, date.
function csvCell(v) {
  v = String(v ?? "");
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const today = localISODate();
  const header = ["exercise_num", "exercise_name", "sets_done", "total_sets", "weight", "reps", "date"];
  const rows = dayExercises.map((ex, i) => {
    const log = state.log[i] || {};
    return [ex.n, ex.name, countDone(i), ex.sets, log.w || "", log.r || "", today].map(csvCell).join(",");
  });
  // Second section: full workout history, one row per (session, exercise).
  // Blank line + own header keeps it self-describing and re-importable.
  const histHeader = ["history_date", "exercise_num", "weight", "reps"];
  const histRows = [];
  loadHistory().forEach((s) => {
    Object.keys(s.entries).forEach((n) => {
      const en = s.entries[n];
      histRows.push([s.date, n, en.w || "", en.r || ""].map(csvCell).join(","));
    });
  });

  let csv = header.join(",") + "\n" + rows.join("\n");
  if (histRows.length) {
    csv += "\n\n" + histHeader.join(",") + "\n" + histRows.join("\n");
  }
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `gym-day${currentDay}-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () =>
  document.getElementById("importFile").click());

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      applyCsv(reader.result);
      save();
      render();
      alert("Imported. Weights, reps and completed sets were restored.");
    } catch (err) {
      alert("Could not read that file. Make sure it's a CSV exported from this app.");
    }
    e.target.value = ""; // allow re-importing the same file
  };
  reader.readAsText(file);
});

// Minimal CSV parser that handles quoted cells. The file may contain two
// blank-line-separated sections: the live session, then (optionally) history.
// We route each section by its header. Rows match exercises by exercise_num,
// so it's robust to reordering.
function applyCsv(text) {
  // Split into sections on blank lines; each section is header + rows.
  const sections = text.replace(/\r/g, "").split(/\n\s*\n/)
    .map((s) => s.split("\n").filter((l) => l.trim() !== ""))
    .filter((s) => s.length);

  const byNum = {};
  dayExercises.forEach((ex, i) => (byNum[ex.n] = i));

  sections.forEach((lines) => {
    const head = parseCsvLine(lines[0]);
    if (head.includes("sets_done")) applySessionSection(lines, head, byNum);
    else if (head.includes("history_date")) applyHistorySection(lines, head);
  });
}

function applySessionSection(lines, head, byNum) {
  const col = (name) => head.indexOf(name);
  const iNum = col("exercise_num"), iDone = col("sets_done"),
        iW = col("weight"), iR = col("reps");
  const fresh = { sets: {}, log: {} };
  for (let r = 1; r < lines.length; r++) {
    const cells = parseCsvLine(lines[r]);
    const i = byNum[cells[iNum]];
    if (i === undefined) continue;
    fresh.log[i] = { w: cells[iW] || "", r: cells[iR] || "" };
    const done = parseInt(cells[iDone], 10) || 0;
    if (done >= dayExercises[i].sets) fresh.sets[i] = true;
  }
  state = fresh;
}

function applyHistorySection(lines, head) {
  const col = (name) => head.indexOf(name);
  const iDate = col("history_date"), iNum = col("exercise_num"),
        iW = col("weight"), iR = col("reps");
  const byDate = {}; // regroup flat rows back into per-session objects
  for (let r = 1; r < lines.length; r++) {
    const cells = parseCsvLine(lines[r]);
    const date = cells[iDate];
    if (!date) continue;
    (byDate[date] = byDate[date] || {})[cells[iNum]] = { w: cells[iW] || "", r: cells[iR] || "" };
  }
  history = Object.keys(byDate).sort().map((date) => ({ date, entries: byDate[date] }));
  saveHistory(history);
}

function parseCsvLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let k = 0; k < line.length; k++) {
    const ch = line[k];
    if (inQ) {
      if (ch === '"' && line[k + 1] === '"') { cur += '"'; k++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

selectDay(currentDay);
</script>
